name: Serveur NORIA — tests et audit

on:
  pull_request:
  push:
    branches: ["cursor/**"]

permissions:
  contents: read

jobs:
  serveur:
    runs-on: ubuntu-latest
    # PostgreSQL : les mêmes tests tournent contre une vraie base (RLS, migrations, sauvegarde).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-local-fictif
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Tests (SQLite)
        run: npm test
      - name: Tests (PostgreSQL 16)
        run: npm test
        env:
          NORIA_TEST_PG: postgres://postgres:ci-local-fictif@127.0.0.1:5432/postgres
      - run: npm audit --audit-level=moderate
