<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1218">
  <meta name="description" content="NORIA, prototype de gestion scolaire : portails de démonstration pour les écoles, les enseignants, les familles et les élèves. Produit de Klirline Inc.">
  <title>NORIA — Une école, une famille et un avenir</title>
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/addons.css">
  <link rel="stylesheet" href="src/design-refresh.css">
  <script defer src="src/i18n.js"></script>
  <script defer src="src/seed.js"></script>
  <script defer src="src/app.js"></script>
  <script defer src="src/addons-i18n.js"></script>
  <script defer src="src/addons-data.js"></script>
  <script defer src="src/addons.js"></script>
  <script defer src="src/tours.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Aller au contenu principal</a>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="src/noria-logo.png" alt="NORIA — Une école, une famille et un avenir"></div>
    <label class="sr-only" for="roleSel">Profil de démonstration</label>
    <select id="roleSel" onchange="KL.role(this.value)" aria-label="Profil de démonstration">
      <option value="direction">Direction</option><option value="secretariat">Secrétariat</option>
      <option value="enseignant">Enseignant</option><option value="comptable">Comptabilité</option>
      <option value="bibliothecaire">Bibliothèque</option><option value="parent">Parent</option>
      <option value="eleve">Élève</option>
    </select>
    <label class="sr-only" for="langSel">Langue</label>
    <select id="langSel" onchange="KL.lang(this.value)" aria-label="Langue"><option value="fr">Français</option><option value="ht">Kreyòl</option></select>
    <button id="connBtn" class="pill" onclick="KL.conn()" aria-label="Changer l'état de connexion">État de connexion</button>
    <button id="syncBtn" class="pill" onclick="KL.sync()" aria-label="Synchroniser les données locales">Synchroniser<span id="syncBadge"></span></button>
  </header>
  <div class="layout">
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <main class="main" id="view" tabindex="-1">
      <p class="small mut" style="margin-top:16px">NORIA est un prototype de cadrage alimenté par des données fictives. Il n'est relié ni au MENFP/SIGEEE, ni à un service de paiement ou de messagerie. Les accès et les données sont simulés dans ce navigateur.</p>
    </main>
  </div>
  <nav class="mnav" id="mnav" aria-label="Navigation mobile"></nav>
  <footer class="site-foot">NORIA est un produit de <strong>Klirline Inc.</strong></footer>
  <div class="toast" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
