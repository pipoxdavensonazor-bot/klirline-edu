# NORIA en production : application + PostgreSQL 16 + Caddy (HTTPS automatique Let's Encrypt).
# Prérequis : fichier .env (copier .env.example), DNS du domaine pointant vers le serveur, ports 80 et 443 ouverts.
#   docker compose up -d --build
# Seul Caddy est exposé ; l'application et la base restent sur le réseau interne.
name: noria

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-noria}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb
    stop_grace_period: 30s

  app:
    build: .
    image: noria:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      DATABASE_URL: postgres://${POSTGRES_USER:-noria}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-noria}
      NORIA_PUBLIC_URL: https://${NORIA_DOMAIN:?définir NORIA_DOMAIN dans .env}
      NORIA_TRUST_PROXY: "1"
      # Assistant sécurité : lecture seule des sauvegardes (âge de la dernière) et du rapport npm audit.
      BACKUP_DIR: /sauvegardes
      NORIA_AUDIT_RAPPORT: /rapports/npm-audit.json
    volumes:
      - ${NORIA_BACKUP_DIR_HOTE:-/var/backups/noria}:/sauvegardes:ro
      - ./deploy/rapports:/rapports:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [interne]
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    mem_limit: 384m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NORIA_DOMAIN: ${NORIA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificats : à conserver (limites de Let's Encrypt)
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [interne]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  interne:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
