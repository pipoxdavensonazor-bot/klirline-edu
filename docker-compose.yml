# NORIA en production : application + PostgreSQL 16 + Caddy (HTTPS automatique Let's Encrypt).
# Prérequis : fichier .env (copier .env.example), DNS du domaine pointant vers le serveur, ports 80 et 443 ouverts
# (derrière Cloudflare : aux seules plages Cloudflare, deploy/cloudflare/pare-feu.sh).
#   docker compose up -d --build
# Seul Caddy est exposé ; l'application et la base restent sur le réseau interne.
name: noria

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-noria}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb
    stop_grace_period: 30s

  app:
    build: .
    image: noria:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      DATABASE_URL: postgres://${POSTGRES_USER:-noria}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-noria}
      NORIA_PUBLIC_URL: https://${NORIA_DOMAIN:?définir NORIA_DOMAIN dans .env}
      NORIA_TRUST_PROXY: "1"
      # Assistant sécurité : lecture seule des sauvegardes (âge de la dernière) et du rapport npm audit.
      BACKUP_DIR: /sauvegardes
      NORIA_AUDIT_RAPPORT: /rapports/npm-audit.json
    volumes:
      - ${NORIA_BACKUP_DIR_HOTE:-/var/backups/noria}:/sauvegardes:ro
      - ./deploy/rapports:/rapports:ro
      # Diffusion des réunions (profil « diffusion ») : listes HLS écrites par MediaMTX/ffmpeg, lues par le relais R2.
      - diffusion_hls:/diffusion:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [interne]
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    mem_limit: 384m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      NORIA_DOMAIN: ${NORIA_DOMAIN}
      # 1 = derrière le proxy Cloudflare (adresse réelle par CF-Connecting-IP, certificat d'origine Cloudflare).
      # 0 (défaut) = Caddy reçoit les clients directement, certificat Let's Encrypt. Voir DEPLOIEMENT.md, section 9.
      NORIA_DERRIERE_CLOUDFLARE: ${NORIA_DERRIERE_CLOUDFLARE:-0}
      NORIA_CF_ORIGIN_CERT: ${NORIA_CF_ORIGIN_CERT:-/etc/caddy/certs/origine.pem}
      NORIA_CF_ORIGIN_KEY: ${NORIA_CF_ORIGIN_KEY:-/etc/caddy/certs/origine.key}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/cloudflare:/etc/caddy/cloudflare:ro   # modes, plages IP Cloudflare (maj-plages.sh)
      - ${NORIA_CF_CERTS_HOTE:-./deploy/certs}:/etc/caddy/certs:ro   # certificat d'origine Cloudflare (mode 1)
      - caddy_data:/data       # certificats : à conserver (limites de Let's Encrypt)
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [interne]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  # Diffusion audio des réunions de parents (désactivée par défaut) : docker compose --profile diffusion up -d
  # Prérequis (.env) : NORIA_DIRECT_URL, NORIA_DIRECT_SECRET, NORIA_R2_*, NORIA_DIRECT_IP ; pare-feu UDP/TCP 8189 ouvert.
  # Voir docs/reunion-diffusion-r2.md. ~30-60 Mo de mémoire, un ffmpeg (AAC 32 kbit/s) par réunion en direct.
  diffusion:
    image: bluenviron/mediamtx:1.21.2-ffmpeg
    profiles: [diffusion]
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${NORIA_DIRECT_IP:-}
    ports:
      - "8189:8189/udp"   # média WebRTC (ICE) du téléphone de la direction
      - "8189:8189/tcp"   # secours si l'UDP est bloqué
    volumes:
      - ./deploy/diffusion/mediamtx.yml:/mediamtx.yml:ro
      - diffusion_hls:/diffusion
    depends_on:
      app:
        condition: service_healthy
    networks: [interne]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    cpus: 0.75
    stop_grace_period: 5s

networks:
  interne:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  diffusion_hls:   # en mémoire (tmpfs) : quelques segments de 6 s par réunion, effacés au fil de l'eau
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=64m,mode=1777" }
